# main 에 올리면: Supabase 에 DB 표·함수·비밀값을 배포하고, 화면(web/)을 GitHub Pages 로 올린다.
# 필요한 저장소 Secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SP_OPENAI_API_KEY, SP_WEB_PASSWORD
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - id: check
        name: 비밀값 확인
        env:
          OPENAI: ${{ secrets.SP_OPENAI_API_KEY }}
          PW: ${{ secrets.SP_WEB_PASSWORD }}
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$REF" ] || missing="$missing SUPABASE_PROJECT_REF"
          [ -n "$OPENAI" ] || missing="$missing SP_OPENAI_API_KEY"
          [ -n "$PW" ] || missing="$missing SP_WEB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::warning::저장소 Secrets 가 없어 배포를 건너뜁니다:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest
      - name: DB 표 만들기
        if: steps.check.outputs.ready == 'true'
        run: |
          python3 -c 'import json; print(json.dumps({"query": open("supabase/schema.sql", encoding="utf-8").read()}))' > /tmp/q.json
          curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json > /dev/null
      - name: 함수 비밀값 넣기
        if: steps.check.outputs.ready == 'true'
        env:
          OPENAI: ${{ secrets.SP_OPENAI_API_KEY }}
          PW: ${{ secrets.SP_WEB_PASSWORD }}
        run: supabase secrets set --project-ref "$REF" "SP_OPENAI_API_KEY=$OPENAI" "SP_WEB_PASSWORD=$PW"
      - name: 함수 배포
        if: steps.check.outputs.ready == 'true'
        run: supabase functions deploy api --project-ref "$REF" --no-verify-jwt

  pages:
    needs: backend
    if: needs.backend.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 함수 주소 넣기
        env:
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          echo "window.SP_CONFIG = {api: 'https://${REF}.supabase.co/functions/v1'};" > web/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
