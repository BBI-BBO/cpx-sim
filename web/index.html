<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CPX 가상 환자</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_circle,add,arrow_back,article,assignment_turned_in,block,cancel,chat,check,check_circle,checklist,close,data_object,delete,edit,edit_note,error,expand_more,forum,groups,help,info,insights,library_books,logout,menu,menu_book,monitor_heart,more_vert,person,playlist_add,refresh,remove,report,save,schedule,science,search,send,sentiment_dissatisfied,stethoscope,thumb_up,timer,unfold_more,warning&display=block">
<script src="config.js"></script>
<script>window.SP_CONFIG = window.SP_CONFIG || {api: ""};  /* GitHub Pages 판: api 에 Supabase 함수 주소 */</script>
<style>
:root{
  --bg:#f8f9fb; --surface:#fff; --s1:#f3f5f8; --s2:#eceff4; --s3:#e1e5ec;
  --on:#1b1d22; --on2:#505668; --on3:#7b8193;
  --line:#e3e6ec; --line2:#cfd4dd;
  --pri:#3456c6; --on-pri:#fff; --pri-c:#e3e9ff; --on-pri-c:#17307a;
  --ok:#1d7a4e; --ok-c:#dcf3e6; --warn:#8a5600; --warn-c:#fdecc8; --bad:#b42318; --bad-c:#fde8e6;
  --exam-c:#e4f4ec; --on-exam-c:#155c3b; --test-c:#fff0dc; --on-test-c:#7a4700;
  --scrim:rgba(15,18,25,.42); --shadow:0 8px 28px rgba(16,24,40,.16),0 2px 6px rgba(16,24,40,.06);
  --r:6px; --r2:8px; --r3:12px;
  --appbar:60px; --drawer:296px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111318; --surface:#181b21; --s1:#1d2128; --s2:#242932; --s3:#2d333e;
  --on:#e6e8ee; --on2:#adb4c3; --on3:#818899;
  --line:#2a2f38; --line2:#3b414d;
  --pri:#aabcff; --on-pri:#0e2160; --pri-c:#2b3f86; --on-pri-c:#e0e6ff;
  --ok:#83d9ab; --ok-c:#173b2a; --warn:#f3c370; --warn-c:#3d2e12; --bad:#ffb4ab; --bad-c:#4a1e1b;
  --exam-c:#173b2a; --on-exam-c:#a8e8c5; --test-c:#3d2e12; --on-test-c:#f8d394;
  --scrim:rgba(0,0,0,.6); --shadow:0 8px 28px rgba(0,0,0,.5); }}
:root[data-theme="dark"]{
  --bg:#111318; --surface:#181b21; --s1:#1d2128; --s2:#242932; --s3:#2d333e;
  --on:#e6e8ee; --on2:#adb4c3; --on3:#818899;
  --line:#2a2f38; --line2:#3b414d;
  --pri:#aabcff; --on-pri:#0e2160; --pri-c:#2b3f86; --on-pri-c:#e0e6ff;
  --ok:#83d9ab; --ok-c:#173b2a; --warn:#f3c370; --warn-c:#3d2e12; --bad:#ffb4ab; --bad-c:#4a1e1b;
  --exam-c:#173b2a; --on-exam-c:#a8e8c5; --test-c:#3d2e12; --on-test-c:#f8d394;
  --scrim:rgba(0,0,0,.6); --shadow:0 8px 28px rgba(0,0,0,.5); }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-y:scroll;touch-action:manipulation}  /* 스크롤바 자리를 늘 잡아 화면이 옆으로 흔들리지 않게 */
body{margin:0;background:var(--bg);color:var(--on);font:16px/1.6 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;letter-spacing:-.003em;-webkit-font-smoothing:antialiased}
body[data-view="conv"]{overflow:hidden}
h1{font-size:23px;line-height:1.3;font-weight:700;margin:0;letter-spacing:-.01em}
h2{font-size:18px;line-height:1.4;font-weight:700;margin:0}
h3{font-size:16px;font-weight:700;margin:0 0 10px}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
.meta{font-size:14px;color:var(--on2)}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;font-feature-settings:"liga";-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;user-select:none;flex:none;overflow:hidden;width:1em}
.ms.f{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}
[hidden]{display:none!important}

/* ── 버튼·칩·입력 ── */
.btn{height:38px;padding:0 16px;border-radius:var(--r);border:0;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap;text-decoration:none;flex:none;transition:background .15s}
.btn .ms{font-size:20px;margin-left:-3px}
.btn.filled{background:var(--pri);color:var(--on-pri)}
.btn.filled:hover{background:color-mix(in srgb,var(--pri) 88%,#000)}
.btn.tonal{background:var(--pri-c);color:var(--on-pri-c)}
.btn.tonal:hover{background:color-mix(in srgb,var(--pri-c) 85%,var(--pri))}
.btn.outline{background:transparent;border:1px solid var(--line2);color:var(--on)}
.btn.text{background:transparent;color:var(--pri);padding:0 10px}
.btn.outline:hover,.btn.text:hover{background:color-mix(in srgb,var(--pri) 8%,transparent)}
.btn.danger{background:var(--bad);color:#fff}
.btn.block{width:100%;height:46px;font-size:16px}
.btn:disabled{opacity:.38;cursor:default}
.iconbtn{width:38px;height:38px;border-radius:var(--r);border:0;background:transparent;color:var(--on2);display:inline-grid;place-items:center;cursor:pointer;flex:none;transition:background .15s}
.iconbtn:hover{background:var(--s2)}
.chip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:4px;background:var(--s2);color:var(--on2);font-size:14px;font-weight:500;white-space:nowrap}
.chip .ms{font-size:18px}
.chip.sm{height:22px;padding:0 7px;font-size:12.5px}
.chip.g{background:var(--ok-c);color:var(--ok)} .chip.y{background:var(--warn-c);color:var(--warn)} .chip.r{background:var(--bad-c);color:var(--bad)} .chip.p{background:var(--pri-c);color:var(--on-pri-c)}
.inp{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);color:var(--on);font:inherit;font-size:16px;line-height:1.55}
.inp:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 16%,transparent)}
textarea.inp{resize:vertical;min-height:76px}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--on2) 50%),linear-gradient(135deg,var(--on2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-size:14px;font-weight:600;color:var(--on2)}
.fld .hint{font-weight:400;color:var(--on3)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;height:38px;flex:none}
.seg button{border:0;background:transparent;padding:0 16px;font-size:15px;font-weight:500;cursor:pointer}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--pri-c);color:var(--on-pri-c);font-weight:600}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:var(--r);background:var(--s2);color:var(--on3)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--on);font:inherit;font-size:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2)}
.pad{padding:18px 20px}

/* ── 상단바 ── */
.appbar{position:fixed;top:0;left:0;right:0;height:var(--appbar);display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--bg);border-bottom:1px solid var(--line);z-index:30}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;text-decoration:none;padding:0 6px;white-space:nowrap}
.brand .ms{color:var(--pri);font-size:25px}
.ctx{display:none;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.spacer{flex:1}

/* ── 사이드바 ── */
.drawer{position:fixed;top:var(--appbar);bottom:0;left:0;width:var(--drawer);background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20;transition:transform .2s ease}
body.drawer-hidden .drawer{transform:translateX(-100%)}
.drawer-mhead{display:none}
.drawer-top{padding:12px 10px 4px;display:flex;flex-direction:column;gap:8px}
.psel{display:flex;align-items:center;gap:12px;width:100%;padding:10px 10px 10px 12px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--surface);cursor:pointer;text-align:left}
.psel:hover{background:var(--s1)}
.psel-main{flex:1;min-width:0;display:flex;flex-direction:column}
.psel-t{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psel-m{font-size:13.5px;color:var(--on2)}
.psel>.ms{color:var(--on3)}
.num{width:34px;height:34px;border-radius:var(--r);background:var(--s2);color:var(--on2);display:grid;place-items:center;font-weight:700;flex:none;font-size:15px}
.num.pri{background:var(--pri);color:var(--on-pri)}
.newbtn{width:100%;height:42px;justify-content:flex-start;padding:0 14px}
.drawer-list{flex:1;overflow-y:auto;padding:0 8px 10px;scrollbar-gutter:stable;overscroll-behavior:contain}
.grp{font-size:13px;font-weight:600;color:var(--on3);padding:14px 10px 4px}
.ni{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);text-decoration:none;cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
.ni:hover{background:var(--s2)}
.ni.on{background:var(--pri-c);color:var(--on-pri-c)}
.ni-main{flex:1;min-width:0}
.ni-t{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni-m{font-size:13px;color:var(--on3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni.on .ni-m{color:inherit;opacity:.75}
.ni>.ms{color:var(--on2)}
.score-badge{font-size:15px;font-weight:700;min-width:26px;text-align:right}
.score-badge.g{color:var(--ok)} .score-badge.y{color:var(--warn)} .score-badge.r{color:var(--bad)}
.live-badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ok);white-space:nowrap}
.live-badge i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.side-empty{padding:26px 14px;text-align:center;color:var(--on3);font-size:14px}
.drawer-foot{border-top:1px solid var(--line);padding:8px}
.drawer-scrim{display:none;position:fixed;inset:0;background:var(--scrim);z-index:35}

/* ── 본문 ── */
.main{margin-left:var(--drawer);padding-top:var(--appbar);min-height:100dvh;transition:margin .2s ease}
body.drawer-hidden .main{margin-left:0}
.content{max-width:960px;margin:0 auto;padding:30px 30px 72px}
.page-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.ph-main{flex:1;min-width:220px}
.ph-main .meta{margin-top:4px}
.ph-act{display:flex;align-items:center;gap:8px}
.empty{min-height:calc(100dvh - var(--appbar) - 100px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.hero{width:68px;height:68px;border-radius:var(--r3);background:var(--pri-c);color:var(--on-pri-c);display:grid;place-items:center}
.hero .ms{font-size:36px}
.empty p{color:var(--on2);max-width:440px;font-size:16px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}

/* ── 진료 화면: 머리 + 탭 + 본문 + 입력 ── */
.conv{height:calc(100dvh - var(--appbar));display:flex;flex-direction:column}
.conv-head{border-bottom:1px solid var(--line);background:var(--bg)}
.ch-in{max-width:880px;margin:0 auto;padding:10px 20px 0}
.ch-row{display:flex;align-items:center;gap:10px}
.pt-info{min-width:0;flex:1}
.pt-name{font-size:17px;font-weight:700;line-height:1.3}
.pt-sub{font-size:14px;color:var(--on2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-chips{display:flex;gap:6px}
.chip.warn{background:var(--bad-c);color:var(--bad)}
.ctabs{display:flex;gap:2px;margin-top:6px}
.ctab{height:42px;padding:0 14px;border:0;background:transparent;color:var(--on2);font-size:15.5px;font-weight:600;cursor:pointer;position:relative;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.ctab .ms{font-size:19px}
.ctab:hover{color:var(--on)}
.ctab.on{color:var(--pri)}
.ctab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--pri)}
.ctab .dot{width:6px;height:6px;border-radius:50%;background:var(--pri)}
.cbody{flex:1;overflow-y:auto;scrollbar-gutter:stable;overscroll-behavior:contain}
.pane{max-width:880px;margin:0 auto;padding:22px 20px 48px}
.log{max-width:880px;margin:0 auto;padding:22px 20px 16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:flex-end}
.row.doc{justify-content:flex-end}
.av{width:32px;height:32px;border-radius:var(--r);background:var(--s2);color:var(--on2);display:grid;place-items:center;flex:none}
.av .ms{font-size:19px}
.bub{max-width:min(580px,82%);padding:10px 14px;border-radius:10px;font-size:16px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.row.pt .bub{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:2px}
.row.doc .bub{background:var(--pri-c);color:var(--on-pri-c);border-bottom-right-radius:2px}
.row.doc.rej .bub{background:transparent;border:1px dashed var(--line2);color:var(--on3);text-decoration:line-through}
.bub-act{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;opacity:.8;margin-bottom:2px}
.bub-act .ms{font-size:16px}
.turn{font-size:12px;color:var(--on3);min-width:18px;text-align:center;margin-bottom:4px}
.tn{align-self:flex-end;display:flex;gap:6px;align-items:flex-start;max-width:min(580px,82%);margin:-6px 0 2px;font-size:14px;line-height:1.45;text-align:left}
.tn .ms{font-size:17px;margin-top:1px}
.tn.good{color:var(--ok)} .tn.warn{color:var(--warn)} .tn.bad{color:var(--bad)}
.tn span:last-child{color:var(--on2)}
.event{align-self:center;display:flex;gap:12px;align-items:flex-start;width:min(620px,100%);padding:11px 15px;border-radius:var(--r2);font-size:15.5px}
.event>.ms{margin-top:1px}
.event b{display:block;font-weight:700}
.event.exam{background:var(--exam-c);color:var(--on-exam-c)}
.event.test{background:var(--test-c);color:var(--on-test-c)}
.event.vit{background:var(--s1);border:1px solid var(--line)}
.event.vit>.ms{color:var(--bad)}
.vit-grid{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:4px}
.vit-grid span{display:flex;flex-direction:column;font-size:15px}
.vit-grid small{font-size:12.5px;color:var(--on3)}
.note-line{align-self:center;display:flex;gap:6px;align-items:center;font-size:14px;color:var(--bad);text-align:center}
.note-line .ms{font-size:18px}
.note-line small{color:var(--on3);font-size:13px;margin-left:4px}
.note-line.info{color:var(--on2)}
.sumbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--on2);padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.dots{display:flex;gap:5px;padding:15px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--on3);animation:blink 1.2s infinite both}
.dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
.composer-in{max-width:880px;margin:0 auto;padding:10px 20px 14px}
.acts{display:flex;gap:6px;margin-bottom:8px}
.act{height:32px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line2);background:transparent;color:var(--on2);display:inline-flex;gap:6px;align-items:center;font-size:14.5px;cursor:pointer}
.act .ms{font-size:18px}
.act.on{background:var(--pri-c);border-color:transparent;color:var(--on-pri-c);font-weight:600}
.act:disabled{opacity:.4;cursor:default}
.inbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r2);padding:5px 5px 5px 14px}
.inbox:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 14%,transparent)}
.inbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--on);font:inherit;font-size:16px;height:38px}
.count{font-size:13px;color:var(--on3);white-space:nowrap}
.count.over{color:var(--bad);font-weight:700}
.send{width:38px;height:38px;border-radius:var(--r);border:0;background:var(--pri);color:var(--on-pri);display:grid;place-items:center;cursor:pointer;flex:none}
.send:disabled{background:var(--s3);color:var(--on3);cursor:default}

/* SOAP 기록 탭 */
.lead{color:var(--on2);font-size:15px;margin-bottom:18px}
.soap-k{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:var(--r);background:var(--pri-c);color:var(--on-pri-c);font-weight:800;font-size:14px;margin-right:8px}
.soap-f label{display:flex;align-items:center;font-size:15px;color:var(--on)}
.soap-foot{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--on2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .ms{font-size:18px}
.sx{display:grid;grid-template-columns:40px 1fr;gap:4px 8px;padding:14px 0;border-bottom:1px solid var(--line)}
.sx:last-of-type{border-bottom:0}
.sx-list{display:flex;flex-direction:column;gap:2px;min-width:0}
.sn{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:var(--r)}
.sn .ms{font-size:19px;margin-top:2px}
.sn.good .ms{color:var(--ok)} .sn.warn .ms{color:#c58a1d} .sn.bad .ms{color:var(--bad)} .sn.none .ms{color:var(--on3)}
.sn.bad{background:color-mix(in srgb,var(--bad-c) 55%,transparent)}
.sn.warn{background:color-mix(in srgb,var(--warn-c) 45%,transparent)}
.sn-t{font-size:16px;line-height:1.5}
.sn-n{font-size:14px;color:var(--on2);margin-top:1px}
.sn-n b{font-weight:600}
.sec-h{display:flex;align-items:center;gap:8px;margin:28px 0 8px}
.sec-h h3{margin:0;flex:1}
.miss{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.miss:last-child{border-bottom:0}
.miss>.ms{font-size:20px;margin-top:2px}
.miss .r{color:var(--bad)} .miss .y{color:#c58a1d} .miss .n{color:var(--on3)}
.miss-what{font-weight:600}
.miss-why{color:var(--on2);font-size:15px}
.miss-fix{margin-top:6px;padding:8px 12px;border-radius:var(--r);background:var(--s1);font-size:15px}

/* 원문 + 하이라이트 (결과 탭) */
.soap-orig{display:grid;grid-template-columns:34px 1fr;gap:12px 10px;font-size:16px;line-height:1.8;align-items:baseline}
.soap-orig .txt{white-space:pre-wrap;word-break:break-word;min-width:0}
.soap-orig .soap-k{margin:0}
mark.hl{color:inherit;background:transparent;border-radius:2px;padding:1px 0;cursor:help;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.hl.good{background:color-mix(in srgb,var(--ok) 15%,transparent);box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--ok) 75%,transparent)}

<script>
/* ───── 기본 도구 ───── */
const $ = (s, r = document) => r.querySelector(s);

const ACTS = {SAY:{icon:"chat", label:"대화"}, EXAM:{icon:"stethoscope", label:"진찰"}, TEST:{icon:"science", label:"검사"}};
const VERD = {good:["check_circle","좋음"], warn:["error","아쉬움"], bad:["cancel","틀림"]};
const isMobile = () => matchMedia("(max-width: 840px)").matches;
const API = (window.SP_CONFIG && SP_CONFIG.api) || "";
const store = {get: k => { try { return localStorage.getItem(k) || ""; } catch(e){ return ""; } }, set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch(e){} }};
let TOKEN = store.get("sp_token");
let CFG = {max_turns:50, max_min:0, maxlen:30}, CASES = [], HIST = [], PSEL = store.get("sp_patient") || "all";
let CV = null, cvTab = "chat", soapEdit = false, act = "SAY", timer = null, renderSeq = 0, prevHash = null;
const PENDING = new Set();   // 대답을 기다리는 진료. 그사이 다른 진료로 옮겨 가도 된다.
const DRAFT = {};            // 진료마다 쓰다 만 입력

async function api(path, body){
  const h = TOKEN ? {Authorization: "Bearer " + TOKEN} : {};
  const r = await fetch(API + path, body ? {method:"POST", headers:{...h, "Content-Type":"application/json"}, body:JSON.stringify(body)} : {headers:h});
  const j = await r.json().catch(() => ({error:"응답을 읽지 못했습니다"}));
  if (r.status === 401) { askLogin(); const e = new Error(j.error || "비밀번호를 입력해 주세요"); e.auth = true; throw e; }
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}

function toast(msg, err){

  t.innerHTML = (err ? I("error") : "") + `<span>${esc(msg)}</span>`;

}

/* 대화상자: {el, done(Promise), close(v)} */
function dialog({title, body = "", actions = [], cls = "", dismiss = true}){
  const w = document.createElement("div"); w.className = "scrim-dlg";
  w.innerHTML = `<div class="dlg ${cls}" role="dialog" aria-modal="true">
    ${title ? `<div class="dlg-h"><h2>${esc(title)}</h2>${dismiss ? `<button class="iconbtn" data-x title="닫기">${I("close")}</button>` : ""}</div>` : ""}
    <div class="dlg-b">${body}</div>
    ${actions.length ? `<div class="dlg-a">${actions.map((a, i) => `<button class="btn ${a.kind || "text"}${a.left ? " left" : ""}" data-i="${i}"${a.id ? ` id="${a.id}"` : ""}>${a.icon ? I(a.icon) : ""}${esc(a.label)}</button>`).join("")}</div>` : ""}</div>`;
  document.body.appendChild(w);
  let resolve; const done = new Promise(r => resolve = r);
  const onKey = e => { if (e.key === "Escape" && dismiss && w.isConnected) close(null); };
  const close = v => { if (!w.isConnected) return; w.remove(); document.removeEventListener("keydown", onKey); resolve(v); };
  document.addEventListener("keydown", onKey);
  w.addEventListener("mousedown", e => { if (e.target === w && dismiss) close(null); });
  $$("[data-x]", w).forEach(b => b.onclick = () => close(null));
  $$(".dlg-a [data-i]", w).forEach(b => b.onclick = () => { const a = actions[+b.dataset.i]; a.onClick ? a.onClick(close, w) : close(a.value); });
  requestAnimationFrame(() => w.classList.add("on"));
  return {el: w, done, close};
}
async function ask(title, msg, ok = "확인", danger = false){
  return !!(await dialog({title, body:`<p class="dlg-msg">${esc(msg)}</p>`, actions:[{label:"취소", value:false}, {label:ok, value:true, kind: danger ? "danger" : "filled"}]}).done);
}
async function askText(title, label, ph){
  const d = dialog({title, body:`<div class="fld"><label>${esc(label)}</label><input class="inp" id="atx" placeholder="${esc(ph || "")}"></div>`,
    actions:[{label:"취소", value:null}, {label:"확인", kind:"filled", onClick:(close, el) => close($("#atx", el).value.trim() || null)}]});
  setTimeout(() => $("#atx", d.el).focus(), 30);
  $("#atx", d.el).onkeydown = e => { if (e.key === "Enter" && !e.isComposing) d.close($("#atx", d.el).value.trim() || null); };
  return d.done;
}
/* 메뉴·작은 창: 누른 버튼 아래에 띄운다 */
let MENU = null;
function closeMenu(){ if (MENU) { MENU.remove(); MENU = null; } }
function popup(anchor, html, alignLeft){
  closeMenu();
  const m = document.createElement("div"); m.className = "menu"; m.innerHTML = html; document.body.appendChild(m); MENU = m;
  const r = anchor.getBoundingClientRect(), mw = Math.max(m.offsetWidth, alignLeft ? r.width : 0), mh = m.offsetHeight;
  if (alignLeft) m.style.width = mw + "px";
  m.style.left = Math.max(8, Math.min(alignLeft ? r.left : r.right - mw, innerWidth - mw - 8)) + "px";
  m.style.top = (r.bottom + 6 + mh > innerHeight ? Math.max(8, r.top - mh - 6) : r.bottom + 6) + "px";
  setTimeout(() => document.addEventListener("mousedown", function off(e){ if (!m.contains(e.target)) { closeMenu(); document.removeEventListener("mousedown", off); } }), 0);
  return m;
}
function menu(anchor, items){
  const m = popup(anchor, items.map((it, i) => it === "-" ? "<hr>" : `<button data-i="${i}" class="${it.danger ? "danger" : ""}">${I(it.icon)}<span class="mi-main">${esc(it.label)}${it.sub ? `<small>${esc(it.sub)}</small>` : ""}</span></button>`).join(""));
  $$("button[data-i]", m).forEach(b => b.onclick = () => { closeMenu(); items[+b.dataset.i].onClick(); });
}

function stampDate(n){ const m = /^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})/.exec(n || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]) : null; }
function dayGroup(n){
  const d = stampDate(n); if (!d) return "그 이전";
  const t = new Date(); t.setHours(0,0,0,0); const d0 = new Date(d); d0.setHours(0,0,0,0);
  const diff = Math.round((t - d0) / 864e5);
  return diff <= 0 ? "오늘" : diff === 1 ? "어제" : diff < 7 ? "지난 7일" : `${d.getFullYear()}년 ${d.getMonth() + 1}월`;
}
function fmtWhen(n){
  const d = stampDate(n); if (!d) return "";
  const hm = `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  return dayGroup(n) === "오늘" ? hm : `${d.getMonth() + 1}월 ${d.getDate()}일 ${hm}`;
}

async function route(){
  const h = decodeURIComponent(location.hash || "");
  if (prevHash && prevHash.startsWith("#edit/") && h !== prevHash && ED) {
    if ((ED._unsaved || edDirty) && !await ask("저장하지 않은 변경", "이 증례에 저장하지 않은 변경이 있습니다. 나갈까요?", "나가기", true)) { history.replaceState(null, "", prevHash); return; }
    ED = null; edDirty = false;
  }
  const m = /^#c\/([^/]+)(?:\/(chat|soap|result))?$/.exec(h) || /^#r\/([^/]+)$/.exec(h);
  if (m && CV && CV.name === m[1]) { prevHash = h; setTab(m[2] || "chat", true); renderSide(); return; }  // 같은 진료 안에서 탭만 바꿈
  navSeq++; leaveConv();
  prevHash = h; closeDrawer(); closeMenu(); renderSide(); setCtx("");
  try {
    if (m) await openConv(m[1], m[2] || "chat");
    else if (h === "#admin") await loadAdmin();
    else if (h.startsWith("#edit/")) await openEditorRoute(h.slice(6));
    else renderHome();
  } catch(e){ fail(e); if (!e.auth) renderHome(); }
}

function leaveConv(){
  if (CV && !CV.done) DRAFT[CV.name] = $("#txt").value;
  CV = null; clearInterval(timer); closeMenu();
}
const CONVC = new Map(), PREF = new Set();  // 연 진료를 기억 (다시 열 때 바로 보여 주고 뒤에서 새로 받아 맞춘다)
let navSeq = 0;
const sigOf = v => JSON.stringify([(v.events || []).length, (v.submits || []).length, v.meta || {}, v.done]);
const fetchConv = name => api("/api/conv?name=" + encodeURIComponent(name)).then(v => { v._t = Date.now(); return v; });
async function openConv(name, tab){
  const my = ++navSeq, cached = CONVC.get(name);
  if (cached) showConv(cached, tab); else showConvLoading(name, tab);
  if (cached && Date.now() - (cached._t || 0) < 15e3) return;  // 방금 받은 것이면 다시 묻지 않음
  let fresh;
  try { fresh = await fetchConv(name); } catch(e){ if (cached && !e.auth) return; throw e; }
  if (my !== navSeq) return;  // 그사이 다른 화면으로 갔음
  if (!cached) { CONVC.set(name, fresh); showConv(fresh, tab); return; }
  if (PENDING.has(name) || sigOf(cached) === sigOf(fresh)) return;
  CONVC.set(name, fresh);
  if (!(cvTab === "soap" && body().contains(document.activeElement))) showConv(fresh, cvTab);  // 쓰는 중이면 건드리지 않음
}
function showConvLoading(name, tab){
  const r = HIST.find(x => x.name === name);

function domWhy(d, j){
  const sb = (j.sub || {})[d], why = (j.reasons || {})[d];
  const parts = sb ? Object.entries(sb).map(([k, x]) => `${esc(k)} ${esc(x)}`).join(" · ") : d === "의사소통" ? "환자 설문 8항목 평균 × 5" : "";

function refHTML(r){
  if (!r) return `<p class="meta">없음</p>`;
  const ul = a => a && a.length ? `<ul>${a.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  let h = `<div class="ref">`;
  if (r.S) h += `<h4>S</h4>${ul(r.S)}`;
  if (r.O) h += `<h4>O</h4>${ul(r.O)}`;
  if (r.A) h += `<h4>A · ${esc(r.A.main || "")}</h4>${ul(r.A.rationale)}${(r.A.ddx || []).length ? `<ul>${r.A.ddx.map(x => `<li><b>감별 ${esc(x.dx)}</b> — ${esc(x.why)}</li>`).join("")}</ul>` : ""}`;
  if (r.P) h += `<h4>P</h4><ul>${[["tests","검사"],["treatment","처치"],["safety","안전"],["followup","추적"]].flatMap(([k, l]) => (r.P[k] || []).map(x => `<li><b>${l}</b> ${esc(x)}</li>`)).join("")}</ul>`;
  if (r.red_flags) h += `<h4>놓치면 위험한 것</h4>${ul(r.red_flags)}`;
  if (r.communication) h += `<h4>설명·공감</h4>${ul(r.communication)}`;
  return h + `</div>`;
}

  $("#v-edit").innerHTML = `<div class="page-head"><button class="iconbtn" id="edBack" title="증례 목록">${I("arrow_back")}</button>
      <div class="ph-main"><h1>증례 ${esc(EDcid)}</h1><div class="meta">${esc(ED.patient?.chief_complaint || "")}${ED.truth ? " · " + esc(ED.truth) : ""}</div></div>
      <div class="ph-act">${ED._unsaved ? `<span class="chip sm y">저장 전</span>` : ""}<button class="iconbtn" id="edJson" title="JSON으로 보기·고치기">${I("data_object")}</button><button class="btn filled" id="edSave">${I("save")}<span class="t">저장</span></button></div></div>
    <div class="tabs">${ED_TABS.map(([k, l]) => `<button class="tab${edTab === k ? " on" : ""}" data-et="${k}">${l}</button>`).join("")}</div>${b}`;
  const grow = t => { t.style.height = "auto"; t.style.height = (t.scrollHeight + 2) + "px"; };
  $$("#v-edit textarea").forEach(t => { grow(t); t.addEventListener("input", () => grow(t)); });
  $$("#v-edit [data-p]").forEach(el => el.addEventListener("input", () => {
    const k = el.dataset.k, v = el.value; edDirty = true;
    setP(ED, el.dataset.p, k === "lines" ? v.split("\n").map(x => x.trim()).filter(Boolean) : k === "num" ? +v : v);
  }));
  $$("#v-edit [data-et]").forEach(x => x.onclick = () => { edTab = x.dataset.et; renderEditor(); });
  $$("#v-edit [data-add]").forEach(x => x.onclick = () => { const a = getP(ED, x.dataset.add) || []; a.push({}); setP(ED, x.dataset.add, a); edDirty = true; renderEditor(); });
  $$("#v-edit [data-del]").forEach(x => x.onclick = () => { const a = getP(ED, x.dataset.del) || []; a.splice(+x.dataset.i, 1); edDirty = true; renderEditor(); });
  $("#edBack").onclick = () => go("#admin");
  $("#edSave").onclick = saveCase;
  $("#edJson").onclick = () => {
    const {_unsaved, ...clean} = ED;
    dialog({title:`증례 ${EDcid} JSON`, cls:"wide", body:`<textarea class="inp" id="jsonTa" style="min-height:58dvh;font:13.5px/1.5 ui-monospace,Menlo,monospace">${esc(JSON.stringify(clean, null, 1))}</textarea>`,
      actions:[{label:"닫기", value:null}, {label:"양식에 반영", kind:"filled", onClick:(close, el) => {
        try { const u = ED._unsaved; ED = JSON.parse($("#jsonTa", el).value); if (u) ED._unsaved = true; edDirty = true; close(null); renderEditor(); toast("반영했습니다. 저장을 눌러야 파일에 씁니다"); }
        catch(e){ toast("JSON 형식 오류: " + e.message, true); }
      }}]});
  };
}
async function saveCase(){
  const {_unsaved, ...data} = ED;
  try {
    await api("/api/admin/case/save", {cid:EDcid, data});
    delete ED._unsaved; edDirty = false; toast("저장했습니다 (이전 판은 보관)"); renderEditor();
    await loadCases(); renderSide();
  } catch(e){ fail(e); }
}

/* ───── 시작: 로그인 확인·환자·진료 목록을 한 번에, 진료 주소로 들어오면 그 진료도 동시에 ───── */
function applyBoot(b){
  CASES = b.cases || []; CFG = {max_turns: b.max_turns, max_min: b.max_min, maxlen: b.maxlen}; HIST = b.history || [];
  if (PSEL !== "all" && !caseOf(PSEL)) setPatient("all"); else renderSide();
}
async function init(){
  try { const b = await api("/api/boot"); if (!b.ok) { askLogin(); return; } applyBoot(b); route(); } catch(e){ fail(e); }
}
(async () => {
  const m = /^#c\/([^/]+)/.exec(decodeURIComponent(location.hash || ""));
  const early = m && TOKEN ? fetchConv(m[1]).then(v => CONVC.set(v.name, v)).catch(() => {}) : null;
  let b;
  try { b = await api("/api/boot"); } catch(e){ if (!e.auth) toast("서버에 연결하지 못했습니다", true); return; }
  if (!b.ok) { show("home"); askLogin(); return; }
  applyBoot(b);
  if (early) await early;
  route();
})();
</script>
</body>
